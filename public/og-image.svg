<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#14141A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4B37F"/>
      <stop offset="1" stop-color="#C5A267"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="260" fill="#C5A267" opacity="0.06"/>
  <circle cx="120" cy="560" r="200" fill="#C5A267" opacity="0.05"/>

  <!-- Graduation cap icon -->
  <g transform="translate(120,235)">
    <path d="M0 0 120-56 240 0 120 56Z" fill="url(#gold)"/>
    <path d="M30 22v58c0 26 36 48 90 48s90-22 90-48V22" fill="none" stroke="#E5C38F" stroke-width="6" stroke-linecap="round"/>
    <rect x="205" y="-6" width="16" height="56" rx="8" fill="#E5C38F"/>
  </g>

  <!-- Wordmark -->
  <text x="470" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" fill="#F4F4F5" letter-spacing="1">ScholarMatch</text>
  <rect x="478" y="332" width="230" height="7" rx="3.5" fill="url(#gold)"/>

  <!-- Tagline -->
  <text x="478" y="398" font-family="Verdana, sans-serif" font-size="34" fill="#B9B9C2">Global Scholarship Discovery</text>
  <text x="478" y="446" font-family="Verdana, sans-serif" font-size="34" fill="#B9B9C2">&amp; Opportunity Portal</text>

  <!-- Feature chips -->
  <g font-family="Verdana, sans-serif" font-size="26" fill="#C5A267">
    <rect x="478" y="474" rx="6" width="0" height="0"/>
  </g>
</svg>
